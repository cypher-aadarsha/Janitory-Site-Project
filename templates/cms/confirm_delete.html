{% extends 'cms/base_cms.html' %}

{% block page_title %}Confirm Deletion{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto; text-align: center; padding: 40px 20px;">
    <div style="background-color: #f8d7da; width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
        <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #e74c3c;"></i>
    </div>
    
    <h2 style="margin-bottom: 20px; color: #2c3e50;">Are you sure?</h2>
    
    <p style="font-size: 1.1rem; color: #7f8c8d; margin-bottom: 30px;">
        You are about to delete the item <strong>"{{ object }}"</strong>. This action cannot be undone.
    </p>
    
    <form method="post">
        {% csrf_token %}
        <div style="display: flex; justify-content: center; gap: 15px;">
            <a href="{% url cancel_url %}" class="btn" style="background: #f1f2f6; color: #2c3e50; padding: 12px 30px; font-weight: 600;">Cancel</a>
            <button type="submit" class="btn btn-danger" style="padding: 12px 30px; font-weight: 600;"><i class="fas fa-trash"></i> Yes, Delete It</button>
        </div>
    </form>
</div>
{% endblock %}
