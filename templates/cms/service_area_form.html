{% extends 'cms/base_cms.html' %}

{% block page_title %}{{ action }} Service Area{% endblock %}

{% block content %}
<div style="margin-bottom: 20px;">
    <a href="{% url 'cms_service_areas' %}" style="color: #7f8c8d; text-decoration: none;"><i class="fas fa-arrow-left"></i> Back to Service Areas</a>
</div>

<div class="card" style="max-width: 800px;">
    <form method="post">
        {% csrf_token %}
        
        <div style="margin-bottom: 20px;">
            <label for="city" style="display: block; margin-bottom: 8px; font-weight: 600;">City / Region Name *</label>
            <input type="text" id="city" name="city" value="{{ area.city }}" required style="width: 100%; padding: 12px; border: 1px solid var(--cms-border); border-radius: 5px; font-size: 1rem;">
        </div>
        
        <div style="margin-bottom: 20px;">
            <label for="description" style="display: block; margin-bottom: 8px; font-weight: 600;">Description (Optional)</label>
            <textarea id="description" name="description" rows="3" style="width: 100%; padding: 12px; border: 1px solid var(--cms-border); border-radius: 5px; font-size: 1rem; resize: vertical;">{{ area.description }}</textarea>
        </div>
        
        <div style="margin-bottom: 30px;">
            <label style="display: flex; align-items: center; cursor: pointer; padding: 12px; border: 1px solid var(--cms-border); border-radius: 5px; background: #f8f9fa;">
                <input type="checkbox" name="is_active" {% if area.is_active or action == 'Add' %}checked{% endif %} style="width: 20px; height: 20px; margin-right: 15px;">
                <span style="font-weight: 600;">Active (Visible on Site)</span>
            </label>
        </div>
        
        <div style="border-top: 1px solid var(--cms-border); padding-top: 20px; display: flex; justify-content: flex-end;">
            <a href="{% url 'cms_service_areas' %}" class="btn" style="color: #7f8c8d; margin-right: 15px;">Cancel</a>
            <button type="submit" class="btn btn-primary" style="font-size: 1.1rem; padding: 12px 30px;"><i class="fas fa-save"></i> Save Area</button>
        </div>
    </form>
</div>
{% endblock %}
